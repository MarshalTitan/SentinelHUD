name: Reconcile Central Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog-sync.yml

permissions:
  contents: read

concurrency:
  group: sentinel-hud-catalog-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative Sentinel HUD manifest
        uses: actions/checkout@v7

      - name: Read and validate Sentinel HUD release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er 'map(select(.InternalName == "SentinelHUD")) | if length == 1 then .[0].AssemblyVersion else error("SentinelHUD entry missing or duplicated") end' repo.json)"
          testing_version="$(jq -er 'map(select(.InternalName == "SentinelHUD"))[0].TestingAssemblyVersion' repo.json)"
          asset="$(jq -er 'map(select(.InternalName == "SentinelHUD"))[0].DownloadLinkInstall' repo.json)"
          update_asset="$(jq -er 'map(select(.InternalName == "SentinelHUD"))[0].DownloadLinkUpdate' repo.json)"
          testing_asset="$(jq -er 'map(select(.InternalName == "SentinelHUD"))[0].DownloadLinkTesting' repo.json)"
          expected_asset="https://github.com/${{ github.repository }}/releases/download/v${version}/SentinelHUD.zip"

          test "$testing_version" = "$version"
          test "$asset" = "$expected_asset"
          test "$update_asset" = "$expected_asset"
          test "$testing_asset" = "$expected_asset"

          curl --fail --location --retry 6 --retry-delay 5 \
            "$asset?catalog-sync=${{ github.run_id }}" \
            --output "$RUNNER_TEMP/SentinelHUD.zip"
          unzip -p "$RUNNER_TEMP/SentinelHUD.zip" SentinelHUD.json \
            | jq -e --arg version "$version" '.InternalName == "SentinelHUD" and .AssemblyVersion == $version' >/dev/null

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for central reconciliation
        id: central
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::error::DALAMUD_CATALOG_TOKEN is required to reconcile the central Sentinel catalog.'
            exit 1
          fi

          started_at="$(date -u +%s)"
          jq -n \
            --arg repository '${{ github.repository }}' \
            --arg commit '${{ github.sha }}' \
            --arg version '${{ steps.release.outputs.version }}' \
            '{
              event_type: "plugin-released",
              client_payload: {
                source_repository: $repository,
                source_commit: $commit,
                internal_name: "SentinelHUD",
                version: $version,
                tag: ("v" + $version)
              }
            }' \
            | gh api --method POST repos/MarshalTitan/Sentinel/dispatches --input -

          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(
              gh api 'repos/MarshalTitan/Sentinel/actions/workflows/update-catalog.yml/runs?event=repository_dispatch&per_page=20' \
                | jq -r --argjson started "$started_at" \
                    '[.workflow_runs[] | select((.created_at | fromdateiso8601) >= $started)] | sort_by(.created_at) | last | .id // empty'
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo '::error::The central repository did not start a repository_dispatch reconciliation run.'
            exit 1
          fi

          for attempt in $(seq 1 120); do
            state="$(gh api "repos/MarshalTitan/Sentinel/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$state")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$state")"
            if [[ "$status" == 'completed' ]]; then
              if [[ "$conclusion" != 'success' ]]; then
                echo "::error::Central catalog reconciliation run $run_id completed with $conclusion."
                exit 1
              fi
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Timed out waiting for central catalog reconciliation run $run_id."
          exit 1

      - name: Verify public central Sentinel catalog
        shell: bash
        run: |
          set -euo pipefail
          catalog="$RUNNER_TEMP/central-repo.json"
          curl --fail --location --retry 12 --retry-delay 5 \
            "https://raw.githubusercontent.com/MarshalTitan/Sentinel/main/repo.json?catalog-sync=${{ github.run_id }}" \
            --output "$catalog"

          jq -e \
            --arg version '${{ steps.release.outputs.version }}' \
            --arg asset '${{ steps.release.outputs.asset }}' \
            'map(select(.InternalName == "SentinelHUD"))
              | length == 1
                and .[0].AssemblyVersion == $version
                and .[0].TestingAssemblyVersion == $version
                and .[0].DownloadLinkInstall == $asset
                and .[0].DownloadLinkUpdate == $asset
                and .[0].DownloadLinkTesting == $asset' \
            "$catalog"

          echo "Verified Sentinel HUD ${{ steps.release.outputs.version }} in the public central catalog."
