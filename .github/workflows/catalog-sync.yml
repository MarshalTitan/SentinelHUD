name: Reconcile Central Catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify current public distribution
        uses: MarshalTitan/Sentinel/.github/actions/distribute@4bbc5ce50837b37c8cfaee5c39a075c4f68858ed
        with:
          internal-name: SentinelHUD
          publish-child: 'false'
          source-token: ''
          notification-token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
