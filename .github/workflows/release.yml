name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sentinel-hud-release
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-live]')
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Verify Sentinel Core pin and UI package hash
        shell: pwsh
        run: ./.github/scripts/Verify-SentinelCore.ps1

      - name: Validate release state
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/SentinelHUD/SentinelHUD.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          $tag = "v$version"
          $releaseJson = gh release view $tag --repo '${{ github.repository }}' --json targetCommitish,isDraft,isPrerelease 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.targetCommitish -ne '${{ github.sha }}' -or $release.isDraft -or $release.isPrerelease) {
              throw "Release '$tag' already belongs to a different source or publication state. Increment the version."
            }
            Write-Host "Release '$tag' already exists for this source. Revalidating its public asset and catalog."
          }
          $global:LASTEXITCODE = 0
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test catalog verification policy
        shell: pwsh
        run: ./.github/scripts/Test-CatalogPolicy.ps1

      - name: Restore
        run: dotnet restore SentinelHUD.slnx --locked-mode -m:1

      - name: Run tests
        run: dotnet run --project tests/SentinelHUD.Core.Tests/SentinelHUD.Core.Tests.csproj -c Release --no-restore

      - name: Run pinned Sentinel Core UI tests
        shell: pwsh
        run: |
          dotnet restore external/SentinelCore/SentinelCore.slnx -m:1
          dotnet build external/SentinelCore/SentinelCore.slnx -c Release --no-restore -m:1
          dotnet run --project external/SentinelCore/tests/SentinelCore.UI.Tests/SentinelCore.UI.Tests.csproj -c Release --no-build

      - name: Build release package
        run: dotnet build src/SentinelHUD/SentinelHUD.csproj -c Release --no-restore -m:1

      - name: Validate package
        shell: pwsh
        run: ./.github/scripts/Validate-Package.ps1 -PackagePath 'src/SentinelHUD/bin/Release/SentinelHUD/latest.zip' -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Test native ImGui Modern minimize and restore
        run: dotnet run --project tests/SentinelHUD.UI.Tests/SentinelHUD.UI.Tests.csproj -c Release

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'src/SentinelHUD/bin/Release/SentinelHUD/latest.zip' -Destination "$env:RUNNER_TEMP\SentinelHUD.zip" -Force

      - name: Publish GitHub release
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' "$env:RUNNER_TEMP\SentinelHUD.zip" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Sentinel HUD ${{ steps.version.outputs.value }}" `
            --notes "Keeps minimize in Sentinel Modern, matching S Rank Sentinel: the same pinned Core header remains visible with icon, title, status, context, drag region and Expand/Close controls. Settings, secondary categories and the action dock are hidden while minimized. The header, /shud and Dalamud Open Config restore the prior full size and current position. Schema 12 adds only minimized state and expanded logical dimensions and preserves all existing settings through the established backed-up migration. Window constraints use Dalamud UI scale once. Native ImGui mouse/keyboard/controller, geometry, drag, reload and Classic checks run before publication. Core stays exactly pinned to 0.3.1 / v0.3.1.0. Public ZIP and immediate central catalog reconciliation are verified before completion."

      - name: Verify public release asset
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelHUD.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SentinelHUD.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download
              if ((Get-Item $download).Length -gt 0) { break }
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }
          ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Publish authoritative child manifest and verify central catalog
        uses: MarshalTitan/Sentinel/.github/actions/distribute@4bbc5ce50837b37c8cfaee5c39a075c4f68858ed
        with:
          internal-name: SentinelHUD
          version: ${{ steps.version.outputs.value }}
          tag: ${{ steps.version.outputs.tag }}
          notification-token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
