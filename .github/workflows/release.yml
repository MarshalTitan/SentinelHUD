name: Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sentinel-hud-release
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-live]')
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Verify Sentinel Core pin and UI package hash
        shell: pwsh
        run: ./.github/scripts/Verify-SentinelCore.ps1

      - name: Validate release state
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/SentinelHUD/SentinelHUD.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          $tag = "v$version"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release '$tag' already exists. Increment the version." }
          $global:LASTEXITCODE = 0
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        run: dotnet restore SentinelHUD.slnx --locked-mode -m:1

      - name: Run tests
        run: dotnet run --project tests/SentinelHUD.Core.Tests/SentinelHUD.Core.Tests.csproj -c Release --no-restore

      - name: Run pinned Sentinel Core UI tests
        shell: pwsh
        run: |
          dotnet restore external/SentinelCore/SentinelCore.slnx -m:1
          dotnet build external/SentinelCore/SentinelCore.slnx -c Release --no-restore -m:1
          dotnet run --project external/SentinelCore/tests/SentinelCore.UI.Tests/SentinelCore.UI.Tests.csproj -c Release --no-build

      - name: Build release package
        run: dotnet build src/SentinelHUD/SentinelHUD.csproj -c Release --no-restore -m:1

      - name: Validate package
        shell: pwsh
        run: ./.github/scripts/Validate-Package.ps1 -PackagePath 'src/SentinelHUD/bin/Release/SentinelHUD/latest.zip' -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'src/SentinelHUD/bin/Release/SentinelHUD/latest.zip' -Destination "$env:RUNNER_TEMP\SentinelHUD.zip" -Force

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' "$env:RUNNER_TEMP\SentinelHUD.zip" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Sentinel HUD ${{ steps.version.outputs.value }}" `
            --notes "Polishes Sentinel HUD's canonical Sentinel Modern 2 shell with MarshalTitan.SentinelCore.UI 0.3.1 (Core v0.3.1.0): one custom draggable header, a unified full-bleed application surface, crisp Font Awesome primary navigation, text-only secondary categories, responsive non-overlapping settings rows, and the strengthened reduced-motion-safe ambient background. Classic remains unchanged, and HUD behavior, layouts, configuration, targeting, awareness, camera, and convenience systems remain intact."

      - name: Verify public release asset
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelHUD.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SentinelHUD.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download
              if ((Get-Item $download).Length -gt 0) { break }
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }
          ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Trigger central Sentinel catalog reconciliation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'DALAMUD_CATALOG_TOKEN is required to publish a Sentinel HUD release to the central Sentinel catalog.'
          }

          $payload = @{
            event_type = 'plugin-released'
            client_payload = @{
              source_repository = '${{ github.repository }}'
              source_commit = '${{ github.sha }}'
              internal_name = 'SentinelHUD'
              version = '${{ steps.version.outputs.value }}'
              tag = '${{ steps.version.outputs.tag }}'
            }
          } | ConvertTo-Json -Depth 5

          $payload | gh api `
            --method POST `
            'repos/MarshalTitan/Sentinel/dispatches' `
            --input -
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to dispatch the central Sentinel catalog reconciliation.'
          }

      - name: Verify public central Sentinel catalog
        shell: pwsh
        run: |
          $catalogUrl = 'https://raw.githubusercontent.com/MarshalTitan/Sentinel/main/repo.json'
          $expectedVersion = '${{ steps.version.outputs.value }}'
          $expectedAsset = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelHUD.zip"

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $catalog = @(Invoke-RestMethod -Uri "$catalogUrl`?release=${{ github.run_id }}-$attempt")
              $entry = @($catalog | Where-Object InternalName -eq 'SentinelHUD')
              if ($entry.Count -eq 1 `
                  -and $entry[0].AssemblyVersion -eq $expectedVersion `
                  -and $entry[0].TestingAssemblyVersion -eq $expectedVersion `
                  -and $entry[0].DownloadLinkInstall -eq $expectedAsset `
                  -and $entry[0].DownloadLinkUpdate -eq $expectedAsset `
                  -and $entry[0].DownloadLinkTesting -eq $expectedAsset) {
                Write-Host "Verified Sentinel HUD $expectedVersion in the public central catalog."
                exit 0
              }
            }
            catch {
              Write-Host "Central catalog verification attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          throw "The public central Sentinel catalog did not reach Sentinel HUD $expectedVersion within five minutes."
